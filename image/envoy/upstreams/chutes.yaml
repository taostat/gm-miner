slots:
  direct_env: CHUTES_API_KEY
  auth_header: authorization
  auth_prefix: "Bearer "

##  Routing on the gateway's selector (`x-gm-upstream-model`) and its
##  `x-gm-ordinary: 1` marker for a non-confidential product, in match order:
##    1. a `-TEE` model marked ordinary goes to Chutes directly;
##    2. any other `-TEE` model goes to the co-located chutes-verify-proxy,
##       which admits the instance on verified TDX and GPU evidence and
##       encrypts the request end to end to its attested key;
##    3. every other request goes to Chutes directly.
##  The Lua filter answers a chat request without a selector with 400.
routes:
  - match:
      prefix: "/"
      headers:
        - name: "x-gm-provider"
          string_match:
            exact: "chutes"
        - name: "x-gm-upstream-model"
          string_match:
            suffix: "-TEE"
            ignore_case: true
        - name: "x-gm-ordinary"
          string_match:
            exact: "1"
    request_headers_to_remove:
      - x-gm-upstream-model
      - x-gm-ordinary
    route:
      cluster: chutes
      host_rewrite_literal: llm.chutes.ai
      timeout: 1800s
      retry_policy:
        retry_on: "reset,connect-failure,refused-stream,5xx"
        num_retries: 1
  - match:
      prefix: "/"
      headers:
        - name: "x-gm-provider"
          string_match:
            exact: "chutes"
        - name: "x-gm-upstream-model"
          string_match:
            suffix: "-TEE"
            ignore_case: true
    request_headers_to_remove:
      - x-gm-ordinary
    route:
      cluster: chutes_verify_proxy
      timeout: 1800s
  - match:
      prefix: "/"
      headers:
        - name: "x-gm-provider"
          string_match:
            exact: "chutes"
    request_headers_to_remove:
      - x-gm-upstream-model
      - x-gm-ordinary
    route:
      cluster: chutes
      host_rewrite_literal: llm.chutes.ai
      timeout: 1800s
      retry_policy:
        retry_on: "reset,connect-failure,refused-stream,5xx"
        num_retries: 1

clusters:
  - name: chutes
    type: LOGICAL_DNS
    connect_timeout: 10s
    dns_lookup_family: V4_ONLY
    typed_extension_protocol_options:
      envoy.extensions.upstreams.http.v3.HttpProtocolOptions:
        "@type": type.googleapis.com/envoy.extensions.upstreams.http.v3.HttpProtocolOptions
        explicit_http_config:
          http2_protocol_options: {}
    load_assignment:
      cluster_name: chutes
      endpoints:
        - lb_endpoints:
            - endpoint:
                address:
                  socket_address:
                    address: llm.chutes.ai
                    port_value: 443
    transport_socket:
      name: envoy.transport_sockets.tls
      typed_config:
        "@type": type.googleapis.com/envoy.extensions.transport_sockets.tls.v3.UpstreamTlsContext
        sni: llm.chutes.ai
        common_tls_context:
          validation_context:
            trusted_ca:
              filename: /etc/ssl/certs/ca-certificates.crt
            match_typed_subject_alt_names:
              - san_type: DNS
                matcher:
                  exact: llm.chutes.ai
  - name: chutes_verify_proxy
    type: STATIC
    connect_timeout: 5s
    load_assignment:
      cluster_name: chutes_verify_proxy
      endpoints:
        - lb_endpoints:
            - endpoint:
                address:
                  socket_address:
                    address: 127.0.0.1
                    port_value: 8083

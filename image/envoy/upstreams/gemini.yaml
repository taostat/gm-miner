slots:
  direct_env: GOOGLE_API_KEY
  auth_header: x-goog-api-key

routes:
  ## TTS is native generateContent but synthesis must not be transparently replayed.
  - match:
      safe_regex:
        google_re2: {}
        regex: "^/v1beta/models/[^/]+-tts:generateContent$"
      headers:
        - name: ":method"
          string_match:
            exact: "POST"
        - name: "x-gm-provider"
          string_match:
            exact: "gemini"
    route:
      cluster: gemini
      host_rewrite_literal: generativelanguage.googleapis.com
      timeout: 1800s

  - match:
      prefix: "/"
      headers:
        - name: "x-gm-provider"
          string_match:
            exact: "gemini"
    route:
      cluster: gemini
      host_rewrite_literal: generativelanguage.googleapis.com
      timeout: 1800s
      retry_policy:
        retry_on: "reset,connect-failure,refused-stream,5xx"
        num_retries: 1

clusters:
  - name: gemini
    type: LOGICAL_DNS
    connect_timeout: 10s
    dns_lookup_family: V4_ONLY
    typed_extension_protocol_options:
      envoy.extensions.upstreams.http.v3.HttpProtocolOptions:
        "@type": type.googleapis.com/envoy.extensions.upstreams.http.v3.HttpProtocolOptions
        explicit_http_config:
          http2_protocol_options:
            max_concurrent_streams: 32
            connection_keepalive:
              interval: 30s
              timeout: 10s
    load_assignment:
      cluster_name: gemini
      endpoints:
        - lb_endpoints:
            - endpoint:
                address:
                  socket_address:
                    address: generativelanguage.googleapis.com
                    port_value: 443
    transport_socket:
      name: envoy.transport_sockets.tls
      typed_config:
        "@type": type.googleapis.com/envoy.extensions.transport_sockets.tls.v3.UpstreamTlsContext
        sni: generativelanguage.googleapis.com
        common_tls_context:
          validation_context:
            trusted_ca:
              filename: /etc/ssl/certs/ca-certificates.crt
            match_typed_subject_alt_names:
              - san_type: DNS
                matcher:
                  exact: generativelanguage.googleapis.com

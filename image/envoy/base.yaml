## Shared part of the miner's Envoy config. `gmcli render-envoy` splices the
## per-upstream files from upstreams/ in at the `gm:upstream-*` markers and
## fills the `__GM_*__` tokens. See README.md for the rendering rules and the
## data plane design.

admin:
  ## Loopback only: /quitquitquit and the config dump must never leave the CVM.
  address:
    socket_address:
      address: 127.0.0.1
      port_value: 9901

## Connection cap: a file-descriptor backstop, not the saturation signal (that is
## the rate limit below). Refuses at accept time with no status code, and is
## sized to fire only in a flood. 8192 is under half the container's 65536 fd
## soft limit (dstack/docker-compose.yaml), per Envoy's sizing guidance.
overload_manager:
  resource_monitors:
    - name: "envoy.resource_monitors.global_downstream_max_connections"
      typed_config:
        "@type": type.googleapis.com/envoy.extensions.resource_monitors.downstream_connections.v3.DownstreamConnectionsConfig
        max_active_downstream_connections: 8192

static_resources:

  listeners:
    - name: ingress
      address:
        socket_address:
          address: 0.0.0.0
          port_value: 8080
      filter_chains:
        - ## RA-TLS: gm-miner-ratls writes these files before Envoy starts (start.sh).
          ## No client certificate: callers prove identity with x-gm-node-key; this
          ## context proves the miner's attestation to them.
          transport_socket:
            name: envoy.transport_sockets.tls
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.transport_sockets.tls.v3.DownstreamTlsContext
              common_tls_context:
                ## h2 first, so a client offering both gets h2. Pairs with
                ## `codec_type: AUTO` on the HCM below.
                alpn_protocols: ["h2", "http/1.1"]
                tls_certificates:
                  - certificate_chain:
                      filename: /tmp/gm-ratls/cert.pem
                    private_key:
                      filename: /tmp/gm-ratls/key.pem
          filters:
            - name: envoy.filters.network.http_connection_manager
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                stat_prefix: ingress_http
                ## One sanitized JSON record per request, to correlate stream endings with
                ## the gateway's request id. Never logs the path, auth, node key, bodies or
                ## arbitrary headers.
                access_log:
                  - name: envoy.access_loggers.stdout
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.access_loggers.stream.v3.StdoutAccessLog
                      log_format:
                        json_format:
                          timestamp: "%START_TIME%"
                          request_id: "%DYNAMIC_METADATA(gm.access_log:request_id)%"
                          product: "%DYNAMIC_METADATA(gm.access_log:product)%"
                          provider: "%DYNAMIC_METADATA(gm.access_log:provider)%"
                          authenticated: "%DYNAMIC_METADATA(gm.access_log:authenticated)%"
                          protocol: "%PROTOCOL%"
                          response_code: "%RESPONSE_CODE%"
                          response_flags: "%RESPONSE_FLAGS%"
                          response_code_details: "%RESPONSE_CODE_DETAILS%"
                          connection_termination_details: "%CONNECTION_TERMINATION_DETAILS%"
                          downstream_connection_id: "%CONNECTION_ID%"
                          downstream_detected_close_type: "%DOWNSTREAM_DETECTED_CLOSE_TYPE%"
                          downstream_local_close_reason: "%DOWNSTREAM_LOCAL_CLOSE_REASON%"
                          upstream_transport_failure_reason: "%UPSTREAM_TRANSPORT_FAILURE_REASON%"
                          upstream_cluster: "%UPSTREAM_CLUSTER%"
                          upstream_connection_id: "%UPSTREAM_CONNECTION_ID%"
                          upstream_connection_ids_attempted: "%UPSTREAM_CONNECTION_IDS_ATTEMPTED%"
                          upstream_detected_close_type: "%UPSTREAM_DETECTED_CLOSE_TYPE%"
                          upstream_local_close_reason: "%UPSTREAM_LOCAL_CLOSE_REASON%"
                          duration_ms: "%DURATION%"
                          bytes_received: "%BYTES_RECEIVED%"
                          bytes_sent: "%BYTES_SENT%"
                          stream_id: "%STREAM_ID%"
                ## AUTO picks h1 or h2 from the ALPN the client negotiated (see
                ## alpn_protocols on the DownstreamTlsContext above).
                codec_type: AUTO
                use_remote_address: true
                ## 1800s, matching the route timeout: see "Route conventions" in README.md.
                stream_idle_timeout: 1800s
                ## A malformed request fails its own stream, not the whole connection.
                stream_error_on_invalid_http_message: true
                http2_protocol_options:
                  ## Same for h2: a bad frame would otherwise GOAWAY every multiplexed stream.
                  override_stream_error_on_invalid_http_message: true
                  ## Advertised in SETTINGS; matches the gateway-side cap (Envoy's default is
                  ## effectively unbounded).
                  max_concurrent_streams: 1024
                ## Rewrite the rate limit's plain-text 429 to JSON. Matched on status, not the
                ## RL flag, which only the router sets; nothing else here produces a 429.
                local_reply_config:
                  mappers:
                    - filter:
                        status_code_filter:
                          comparison:
                            op: EQ
                            value:
                              default_value: 429
                              runtime_key: local_reply.rate_limited.status
                      body_format_override:
                        json_format:
                          error: "miner saturated — request rate limited"
                    ## A Chutes verifier that cannot be reached answers 503, as when no
                    ## verifier is configured; the Lua filter marks verifier requests.
                    - filter:
                        and_filter:
                          filters:
                            - response_flag_filter:
                                flags: ["UF", "UC", "UR", "URX"]
                            - metadata_filter:
                                matcher:
                                  filter: gm.route
                                  path:
                                    - key: chutes_verifier
                                  value:
                                    bool_match: true
                      status_code: 503
                      body_format_override:
                        json_format:
                          error:
                            type: "gm_chutes_verifier_unavailable"
                            message: "Chutes verifier unavailable"
                    ## Envoy's own plain-text 503 for an upstream that never answered becomes a
                    ## JSON 502. Never put a provider-drain phrase (quota, credit, billing,
                    ## account, api key) in this body: see README.md.
                    - filter:
                        response_flag_filter:
                          flags: ["UF", "UC", "UR", "URX"]
                      status_code: 502
                      body_format_override:
                        json_format:
                          error:
                            type: "envoy_upstream_error"
                            message: "upstream request failed"
                route_config:
                  name: provider_routes
                  virtual_hosts:
                    - name: providers
                      domains: ["*"]
                      routes:

                        ## Attestation surface, served by the loopback attestd. Public by contract
                        ## (gm/docs/contracts/gateway-attestation-info.md): the Lua filter skips the
                        ## node-key check for this exact path. Matched first.
                        - match:
                            path: "/attestation/info"
                          route:
                            cluster: attestd
                            timeout: 10s
                          request_headers_to_remove:
                            - x-gm-upstream-slot
                          ## Exempt from the rate limit so a saturated miner does not read as down.
                          typed_per_filter_config:
                            envoy.filters.http.local_ratelimit:
                              "@type": type.googleapis.com/envoy.extensions.filters.http.local_ratelimit.v3.LocalRateLimit
                              stat_prefix: ingress_http_rate_limit_attestation
                              token_bucket:
                                max_tokens: 1
                                tokens_per_fill: 1
                                fill_interval: 1s
                              filter_enabled:
                                default_value:
                                  numerator: 0
                                  denominator: HUNDRED
                              filter_enforced:
                                default_value:
                                  numerator: 0
                                  denominator: HUNDRED

                        - gm:upstream-routes

                        ## No provider matched. A provider route with an unset key forwards anyway
                        ## and gets a 401 upstream; this 501 means "no such route" (spec §10.2).
                        - match:
                            prefix: "/"
                          direct_response:
                            status: 501
                            body:
                              inline_string: |
                                {"error":"provider not configured on this miner"}
                          request_headers_to_remove:
                            - authorization
                            - x-gm-upstream-slot

                http_filters:
                  ## Node-key check and key-slot selection (Mechanism 1 of
                  ## attestation-and-identity.md). The node secret and slot_config are
                  ## rendered in at start; key values stay in the process environment and
                  ## are read with os.getenv per request. An unavailable slot is a 421 before
                  ## the router can forward.
                  - name: envoy.filters.http.lua
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.lua.v3.Lua
                      default_source_code:
                        inline_string: |
                          local expected = "__GM_NODE_SECRET__"
                          local slot_config = __GM_SLOT_CONFIG__

                          local function json_escape(value)
                            value = tostring(value or "")
                            value = value:gsub("\\", "\\\\")
                            value = value:gsub("\"", "\\\"")
                            value = value:gsub("[%z\1-\31]", function(ch)
                              return string.format("\\u%04x", string.byte(ch))
                            end)
                            return value
                          end

                          -- 421 is reserved for slot mismatch by the
                          -- upstream-key-slots protocol contract
                          -- (gm repo, docs/contracts/upstream-key-slots.md):
                          -- no provider returns it through these routes,
                          -- so the gateway classifies it pre-stream.
                          local function slot_unavailable(handle, slot_id)
                            handle:respond(
                              {[":status"] = "421",
                               ["content-type"] = "application/json"},
                              "{\"error\":{\"type\":\"gm_slot_unavailable\",\"slot_id\":\"" ..
                                json_escape(slot_id) .. "\"}}")
                          end

                          local function strip_inbound_auth(headers)
                            headers:remove("authorization")
                            headers:remove("x-api-key")
                            headers:remove("x-goog-api-key")
                            headers:remove("api-key")
                          end

                          local function strip_internal_headers(headers, provider)
                            -- Envoy forbids header mutation during iteration. Keep the
                            -- route discriminator until route actions remove it,
                            -- NEAR's validated selector until its loopback verifier,
                            -- and Chutes' selector and ordinary marker, which choose
                            -- its route and are removed by that route.
                            local names = {}
                            for name in pairs(headers) do
                              if name:sub(1, 5) == "x-gm-"
                                and name ~= "x-gm-provider"
                                and not ((provider == "near" or provider == "chutes")
                                  and name == "x-gm-upstream-model")
                                and not (provider == "chutes" and name == "x-gm-ordinary") then
                                names[#names + 1] = name
                              end
                            end
                            for _, name in ipairs(names) do
                              headers:remove(name)
                            end
                          end

                          local function getenv(name)
                            if os == nil or os.getenv == nil then
                              return nil
                            end
                            return os.getenv(name)
                          end

                          -- Callers must strip_inbound_auth(headers)
                          -- first; this add relies on the auth headers
                          -- already being gone.
                          local function set_direct_auth(headers, cfg, key)
                            headers:add(cfg.auth_header, cfg.auth_prefix .. key)
                          end

                          local function select_upstream_slot(handle, headers, provider)
                            local requested = headers:get("x-gm-upstream-slot")
                            local cfg = slot_config[provider]
                            if cfg == nil then
                              -- Contract: a slot header naming a provider
                              -- with no slots is 421, never forwarded.
                              if requested ~= nil then
                                slot_unavailable(handle, requested)
                                return false
                              end
                              return true
                            end

                            if cfg.disabled then
                              if requested ~= nil then
                                slot_unavailable(handle, requested)
                              else
                                handle:respond(
                                  {[":status"] = "400",
                                   ["content-type"] = "application/json"},
                                  "{\"error\":{\"type\":\"gm_unqualified_surface\",\"message\":\"AWS Bedrock is unqualified inside this image: inference is disabled\"}}")
                              end
                              return false
                            end
                            if cfg.cloud then
                              if requested == nil then
                                slot_unavailable(handle, "")
                                return false
                              end
                              local env_name = cfg.slots[requested]
                              if env_name == nil or getenv(env_name) == nil then
                                slot_unavailable(handle, requested)
                                return false
                              end
                              return true
                            end
                            local env_name = nil
                            if requested ~= nil then
                              env_name = cfg.slots[requested]
                              if env_name == nil then
                                slot_unavailable(handle, requested)
                                return false
                              end
                            else
                              env_name = cfg.default_env or cfg.direct_env
                            end

                            local key = getenv(env_name)
                            if key == nil then
                              if env_name == cfg.direct_env then
                                key = ""
                              else
                                slot_unavailable(handle, requested or "")
                                return false
                              end
                            end

                            set_direct_auth(headers, cfg, key)
                            return true
                          end

                          local function reject(handle, status, message)
                            handle:respond(
                              {[":status"] = status,
                               ["content-type"] = "application/json"},
                              "{\"error\":\"" .. message .. "\"}")
                          end

                          -- Chutes routes on one exact selector: a single value with no
                          -- comma, required on every path but the model list. A `-TEE`
                          -- selector needs the verifier, which runs only with a key.
                          local function chutes_selector_accepted(handle, headers, bare)
                            local selector = headers:get("x-gm-upstream-model")
                            if selector == nil then
                              if bare == "/v1/models" then
                                return true
                              end
                              reject(handle, "400", "missing Chutes source model")
                              return false
                            end
                            if selector:match("^%s*$") then
                              reject(handle, "400", "empty Chutes source model")
                              return false
                            end
                            if selector:find(",", 1, true)
                              or headers:getNumValues("x-gm-upstream-model") ~= 1 then
                              reject(handle, "400", "ambiguous Chutes source model")
                              return false
                            end
                            if selector:lower():sub(-4) == "-tee" then
                              local key = getenv("CHUTES_API_KEY")
                              if key == nil or key == "" then
                                reject(handle, "503", "Chutes verifier unavailable")
                                return false
                              end
                              -- Lets the local reply mapper answer 503 if the verifier
                              -- cannot be reached; an ordinary request goes direct.
                              if headers:get("x-gm-ordinary") ~= "1" then
                                handle:streamInfo():dynamicMetadata():set(
                                  "gm.route", "chutes_verifier", true)
                              end
                            end
                            return true
                          end

                          function envoy_on_request(handle)
                            -- The attestation surface is public by
                            -- contract: the registry's control loop
                            -- probes GET /attestation/info WITHOUT the
                            -- node secret, and auditors curl it. Skip
                            -- the inbound node-secret check for that
                            -- path; every other path on the data plane
                            -- still requires x-gm-node-key. The :path
                            -- pseudo-header carries the query string
                            -- (?nonce=...), so strip it before matching.
                            local headers = handle:headers()
                            local path = headers:get(":path") or ""
                            local bare = path:match("^[^?]*")
                            if bare == "/attestation/info" then
                              return
                            end
                            if expected ~= "" then
                              local presented = headers:get("x-gm-node-key")
                              if presented ~= expected then
                                handle:respond(
                                  {[":status"] = "401",
                                   ["content-type"] = "application/json"},
                                  "{\"error\":\"missing or invalid x-gm-node-key\"}")
                                return
                              end
                            end
                            -- Header cleanup removes gm metadata before the
                            -- upstream request leaves the CVM. Only after the
                            -- node key has authenticated the caller, snapshot
                            -- the three non-secret correlation values into
                            -- stream-local metadata so teardown can still join
                            -- this record to the gateway. Never copy node keys,
                            -- provider auth, paths, or bodies. The authenticated
                            -- marker lets auditors reject pre-auth local replies.
                            local access_metadata = handle:streamInfo():dynamicMetadata()
                            access_metadata:set(
                              "gm.access_log", "request_id",
                              headers:get("x-gm-request-id") or "")
                            access_metadata:set(
                              "gm.access_log", "product",
                              headers:get("x-gm-product") or "")
                            access_metadata:set(
                              "gm.access_log", "provider",
                              headers:get("x-gm-provider") or "")
                            access_metadata:set(
                              "gm.access_log", "authenticated", true)
                            strip_inbound_auth(headers)
                            local provider = headers:get("x-gm-provider")
                            if provider == "deepinfra" and bare:sub(1, 14) == "/v1/inference/" then
                              headers:remove("x-envoy-retry-on")
                              headers:remove("x-envoy-retry-grpc-on")
                              headers:remove("x-envoy-max-retries")
                              headers:remove("x-envoy-hedge-on-per-try-timeout")
                            end
                            if provider == "kubetee" and bare == "/v1/images/generations" then
                              headers:remove("x-envoy-retry-on")
                              headers:remove("x-envoy-retry-grpc-on")
                              headers:remove("x-envoy-max-retries")
                              headers:remove("x-envoy-hedge-on-per-try-timeout")
                            end
                            if (provider ~= "near" and provider ~= "chutes")
                              or (provider == "near" and bare == "/v1/models") then
                              headers:remove("x-gm-upstream-model")
                            end
                            if provider == "chutes" and not chutes_selector_accepted(handle, headers, bare) then
                              return
                            end
                            if provider == "near" and bare ~= "/v1/models" then
                              local model = headers:get("x-gm-upstream-model")
                              if model ~= "zai-org/GLM-5.1-FP8"
                                and model ~= "Qwen/Qwen3.6-27B-FP8"
                                and model ~= "z-ai/glm-5.2"
                                and model ~= "deepseek-ai/DeepSeek-V4-Flash"
                                and model ~= "google/gemma-4-31B-it"
                                and model ~= "Qwen/Qwen3.8-27B"
                                and model ~= "black-forest-labs/FLUX.2-klein-4B" then
                                handle:respond(
                                  {[":status"] = "400",
                                   ["content-type"] = "application/json"},
                                  "{\"error\":\"missing or unsupported NEAR source model\"}")
                                return
                              end
                            end
                            if not select_upstream_slot(handle, headers, provider) then
                              return
                            end
                            strip_internal_headers(headers, provider)
                          end
                  ## The saturation signal: 429 when the process-wide bucket of 500
                  ## requests/s is empty (JSON body via local_reply_config above). Tunable
                  ## until per-CVM benchmarking refines it; /attestation/info is exempt.
                  - name: envoy.filters.http.local_ratelimit
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.local_ratelimit.v3.LocalRateLimit
                      stat_prefix: ingress_http_rate_limit
                      token_bucket:
                        max_tokens: 500
                        tokens_per_fill: 500
                        fill_interval: 1s
                      filter_enabled:
                        default_value:
                          numerator: 100
                          denominator: HUNDRED
                      filter_enforced:
                        default_value:
                          numerator: 100
                          denominator: HUNDRED
                  ## The router filter terminates the chain.
                  - name: envoy.filters.http.router
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router

    ## Metrics: only /stats/prometheus, proxied to the loopback admin port and
    ## gated on x-gm-node-key (skipped when the secret is unset). Every other
    ## path is a 404, so /quitquitquit and the config dump stay unreachable.
    - name: metrics
      address:
        socket_address:
          address: 0.0.0.0
          port_value: 9902
      filter_chains:
        - filters:
            - name: envoy.filters.network.http_connection_manager
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                stat_prefix: metrics_http
                route_config:
                  name: metrics_routes
                  virtual_hosts:
                    - name: metrics
                      domains: ["*"]
                      routes:
                        ## Exact-path match: only /stats/prometheus is
                        ## proxied to the admin port. The header strip
                        ## keeps the node key out of the loopback hop.
                        - match:
                            path: "/stats/prometheus"
                          route:
                            cluster: metrics_admin
                            timeout: 10s
                          request_headers_to_remove:
                            - x-gm-node-key
                            - x-gm-upstream-slot
                        ## Every other path — including the rest of the
                        ## admin surface — returns 404 and never reaches
                        ## the admin port.
                        - match:
                            prefix: "/"
                          direct_response:
                            status: 404
                            body:
                              inline_string: |
                                {"error":"not found; only /stats/prometheus is exposed"}
                          request_headers_to_remove:
                            - x-gm-upstream-slot
                http_filters:
                  ## Same node-secret gate as the data plane, without
                  ## the /attestation/info exemption — every path here
                  ## requires x-gm-node-key. start.sh substitutes
                  ## __GM_NODE_SECRET__ with the GM_NODE_SECRET env var;
                  ## an empty literal (var unset) skips the check.
                  - name: envoy.filters.http.lua
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.lua.v3.Lua
                      default_source_code:
                        inline_string: |
                          local expected = "__GM_NODE_SECRET__"
                          function envoy_on_request(handle)
                            if expected == "" then
                              return
                            end
                            local presented = handle:headers():get("x-gm-node-key")
                            if presented ~= expected then
                              handle:respond(
                                {[":status"] = "401",
                                 ["content-type"] = "application/json"},
                                "{\"error\":\"missing or invalid x-gm-node-key\"}")
                            end
                          end
                  - name: envoy.filters.http.router
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router

  clusters:

    ## Loopback attestd (127.0.0.1:8081); the hop never leaves the container.
    - name: attestd
      type: STATIC
      connect_timeout: 5s
      load_assignment:
        cluster_name: attestd
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address:
                      address: 127.0.0.1
                      port_value: 8081

    ## Envoy's loopback admin port; only /stats/prometheus is routed here.
    - name: metrics_admin
      type: STATIC
      connect_timeout: 5s
      load_assignment:
        cluster_name: metrics_admin
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address:
                      address: 127.0.0.1
                      port_value: 9901

    - gm:upstream-clusters

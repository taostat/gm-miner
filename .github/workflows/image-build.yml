name: Image Build

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    name: Build and push container image
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7.4.0
        with:
          context: .
          file: image/Dockerfile
          push: true
          provenance: false
          tags: ghcr.io/taostat/gm-miner:sha-${{ github.sha }}

      - name: Summary
        env:
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          {
            echo "## Image pushed"
            echo ""
            echo "**Digest:** \`ghcr.io/taostat/gm-miner@${IMAGE_DIGEST}\`"
            echo "**Tag:** \`ghcr.io/taostat/gm-miner:sha-${GITHUB_SHA}\`"
            echo ""
            echo "Use this ref for \`gm-miner deploy --image-ref\`:"
            echo "\`ghcr.io/taostat/gm-miner@${IMAGE_DIGEST}\`"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "Image digest: ghcr.io/taostat/gm-miner@${IMAGE_DIGEST}"
